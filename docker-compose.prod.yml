version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: kioskos_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-kioskos_db}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mysql/data:/var/lib/mysql
    networks:
      - internal_network
    restart: always

  adminer:
    image: adminer
    container_name: kioskos_adminer
    environment:
      - ADMINER_DEFAULT_SERVER=kioskos_mysql
    restart: always
    expose:
      - "80"
    networks:
      - dokploy-network
      - internal_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: kioskos_backend
    environment:
      NODE_ENV: production
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-kioskos_db}
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      APP_PORT: 3000
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
    networks:
      - dokploy-network
      - internal_network
    depends_on:
      - mysql
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: kioskos_frontend
    expose:
      - "3000"
    networks:
      - dokploy-network
      - internal_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
    depends_on:
      - backend
    restart: always

  db-backup:
    image: fradelg/mysql-cron-backup
    container_name: kioskos_db_backup
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASS=${DB_ROOT_PASSWORD}
      - MAX_BACKUPS=7
      - CRON_TIME=0 4 * * *
    volumes:
      - ./mysql/backups:/backup
    networks:
      - dokploy-network
      - internal_network
    depends_on:
      - mysql
    restart: always

networks:
  internal_network:
    driver: bridge
  dokploy-network:
    external: true
