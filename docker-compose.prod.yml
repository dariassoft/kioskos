version: '3.8'

services:
  # ==========================================
  # BASE DE DATOS — MySQL 8.0
  # ==========================================
  db:
    image: mysql:8.0
    container_name: kioskos_mysql
    restart: always
    environment:
      MYSQL_DATABASE: kioskos_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: dev_user
      MYSQL_PASSWORD: dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dev_user", "-pdev_password" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # CACHE — Redis 7
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: kioskos_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - internal_network
      - dokploy-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # BACKEND — NestJS API
  # ==========================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kioskos_api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dokploy-network
      - internal_network

  # ==========================================
  # FRONTEND — React + Vite
  # ==========================================
  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: kioskos_client
    restart: always
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - api
    networks:
      - dokploy-network
      - internal_network

  # ==========================================
  # ADMINER — Gestor visual de MySQL
  # ==========================================
  adminer:
    image: adminer:latest
    container_name: kioskos_adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - dokploy-network
      - internal_network
    depends_on:
      - db

networks:
  kioskos_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
