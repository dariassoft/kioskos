server {
    listen 80;
    server_name _;

    # Resolver DNS de Docker: evita "Host is unreachable" cuando el contenedor
    # 'api' se redeploya y cambia de IP. Con proxy_pass a hostname estático,
    # Nginx cachea la IP al arrancar y nunca la actualiza.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desactivar caché para archivos de PWA
    location ~* (sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        proxy_no_cache 1;
    }

    # Proxy para la API (Redirige /api/v1/... al contenedor backend)
    # Usar variable fuerza re-resolución DNS en cada request (no cachea la IP)
    location /api/ {
        set $upstream_api http://api:3000;
        proxy_pass $upstream_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Ajustes de timeout para peticiones largas
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Caché para los assets estáticos
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg|webp|avif)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # WebSocket (Socket.io) — también con re-resolución DNS
    location /socket.io/ {
        set $upstream_ws http://api:3000;
        proxy_pass $upstream_ws/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Evita logs de 404 para archivos no encontrados que no sean manejados por React
    location = /404.html {
        internal;
    }
}
