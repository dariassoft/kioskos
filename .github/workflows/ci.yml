name: ✅ CI — Verificación de Pull Requests

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  type-check:
    name: 🔍 Type Check & Build Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Type check backend (TypeScript)
        working-directory: backend
        run: npx tsc --noEmit

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Type check frontend (TypeScript)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build de producción del frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://placeholder.example.com

      - name: Build de producción del backend
        working-directory: backend
        run: npm run build

